[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsg"
version = "0.2.0"
description = "A typing speed game for your desktop, written with pygame."
readme = "README.md"
license = "MIT"
license-files = ["license"]
authors = [{ name = "Eliaz Bobadilla", email = "eliaz.bobadilladev@gmail.com" }]
requires-python = ">=3.10"
keywords = ["typing", "typing-test", "speed-test", "wpm", "game", "pygame"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = ["pygame>=2.6"]

[project.urls]
Homepage = "https://github.com/UltiRequiem/tsg"
Issues = "https://github.com/UltiRequiem/tsg/issues"
Changelog = "https://github.com/UltiRequiem/tsg/blob/main/CHANGELOG.md"

[project.scripts]
tsg = "tsg:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["tsg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
